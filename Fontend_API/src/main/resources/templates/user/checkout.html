<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Checkout | Sourav Ecom</title>

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        body { background-color: #f1f3f6; }
        .checkout-container { max-width: 1000px; margin: 40px auto; }
        .card { border-radius: 12px; }
        .address-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            position: relative;
        }
        .address-box:hover {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        .address-actions {
            position: absolute;
            right: 12px;
            top: 12px;
        }
        .address-actions i {
            font-size: 18px;
            margin-left: 12px;
            cursor: pointer;
            color: #555;
        }
        .address-actions i:hover { color: #0d6efd; }
        .pay-btn { font-size: 18px; padding: 14px; }
        .order-summary { position: sticky; top: 20px; }
    </style>
</head>

<body>

<div class="container checkout-container">

    <!-- FLASH MESSAGE -->
    <div th:if="${sucmsg}" id="flashMsg" class="alert alert-success text-center">
        <span th:text="${sucmsg}"></span>
    </div>

    <div class="row g-4">

        <!-- ================= LEFT SIDE ================= -->
        <div class="col-md-8">
            <div class="card shadow-sm p-4">

                <h4 class="mb-3">Delivery Address</h4>

               <!-- ================= ADDRESS OPTIONS ================= -->
<div class="mb-3">

    <!-- Current (Default Address) -->
    <label th:if="${hasDefaultAddress}" class="me-3">
        <input type="radio"
               name="addressOption"
               value="current"
               th:checked="${hasDefaultAddress}"
               onclick="toggleAddress()">
        Current
    </label>

    <!-- Existing Addresses -->
    <label th:if="${hasExistingAddress}" class="me-3">
        <input type="radio"
               name="addressOption"
               value="existing"
               onclick="toggleAddress()">
        Existing
    </label>

    <!-- New Address (Always Visible) -->
    <label>
        <input type="radio"
               name="addressOption"
               value="new"
               th:checked="${!hasDefaultAddress and !hasExistingAddress}"
               onclick="toggleAddress()">
        New
    </label>

</div>
                <!-- ================= CURRENT ADDRESS ================= -->
                <div id="currentAddressSection"
                     th:if="${hasDefaultAddress}">

                    <div class="address-box">

                        <div class="address-actions">
                            <a th:href="@{/cart/address/edit/{id}(id=${defaultcheckout.shippingAddress.addid})}">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/cart/address/delete/{id}(id=${defaultcheckout.shippingAddress.addid})}"
                               onclick="return confirm('Delete this address?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>

                        <input type="radio" name="selectedAddress"
                               th:value="${defaultcheckout.shippingAddress.addid}" checked>

                        <strong class="ms-2"
                                th:text="${defaultcheckout.shippingAddress.receiverName}"></strong><br>

                        <span th:text="${defaultcheckout.shippingAddress.houseno}"></span>,
                        <span th:text="${defaultcheckout.shippingAddress.city}"></span>,
                        <span th:text="${defaultcheckout.shippingAddress.state}"></span>,
                        <span th:text="${defaultcheckout.shippingAddress.country}"></span> -
                        <span th:text="${defaultcheckout.shippingAddress.zipcode}"></span><br>

                        📞 <span th:text="${defaultcheckout.shippingAddress.receiverPhnNo}"></span>
                    </div>
                </div>

                <!-- ================= EXISTING ADDRESSES ================= -->
                <div id="existingAddressSection"
                     style="display:none;"
                     th:if="${hasExistingAddress}">

                    <div th:each="addr : ${shippingAdresslist}" class="address-box">

                        <div class="address-actions">
                            <a th:href="@{/cart/address/edit/{id}(id=${addr.addid})}">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/cart/address/delete/{id}(id=${addr.addid})}"
                               onclick="return confirm('Delete this address?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>

                        <input type="radio" name="selectedAddress" th:value="${addr.addid}">
                        <strong class="ms-2" th:text="${addr.receiverName}"></strong><br>

                        <span th:text="${addr.houseno}"></span>,
                        <span th:text="${addr.city}"></span>,
                        <span th:text="${addr.state}"></span> -
                        <span th:text="${addr.zipcode}"></span><br>

                        📞 <span th:text="${addr.receiverPhnNo}"></span>
                    </div>
                </div>

                <!-- ================= NEW ADDRESS ================= -->
                <div id="newAddressSection"
                     th:style="${!hasDefaultAddress} ? 'display:block;' : 'display:none;'">

                    <h5>Add New Address</h5>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="receiverName" placeholder="Receiver Name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="receiverPhnNo" placeholder="Phone Number">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="houseno" placeholder="House / Flat No">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="city" placeholder="City">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="state" placeholder="State">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="country" placeholder="Country">
                        </div>
                        <div class="col-md-6 mb-3">
                            <input class="form-control" id="zipcode" placeholder="Zipcode">
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ================= RIGHT SIDE ================= -->
        <div class="col-md-4">
            <div class="card shadow-sm p-4 order-summary">
                <h5>Order Summary</h5>
                <p>Total Items: <strong th:text="${totalItems}">0</strong></p>
                <p>Total Price: ₹<strong th:text="${totalPrice}">0</strong></p>

                <button class="btn btn-primary w-100 pay-btn mt-3" onclick="placeOrder()">
                    Pay Securely
                </button>
            </div>
        </div>

    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
function toggleAddress() {

    const selectedRadio = document.querySelector('input[name="addressOption"]:checked');
    if (!selectedRadio) return;

    const option = selectedRadio.value;

    const current = document.getElementById("currentAddressSection");
    const existing = document.getElementById("existingAddressSection");
    const newSec = document.getElementById("newAddressSection");

    if(current) current.style.display = option === "current" ? "block" : "none";
    if(existing) existing.style.display = option === "existing" ? "block" : "none";
    if(newSec) newSec.style.display = option === "new" ? "block" : "none";
}

function placeOrder() {

    const option = document.querySelector('input[name="addressOption"]:checked').value;

    let payload = { checkout: {}, newAddress: null };

    if (option === "current" || option === "existing") {

        const selected = document.querySelector('input[name="selectedAddress"]:checked');

        if (!selected) {
            alert("Please select an address");
            return;
        }

        payload.checkout.existingAddressId = Number(selected.value);
    }

    if (option === "new") {

        payload.newAddress = {
            receiverName: document.getElementById("receiverName").value,
            receiverPhnNo: document.getElementById("receiverPhnNo").value,
            houseno: document.getElementById("houseno").value,
            city: document.getElementById("city").value,
            state: document.getElementById("state").value,
            country: document.getElementById("country").value,
            zipcode: document.getElementById("zipcode").value
        };

        for (const key in payload.newAddress) {
            if (!payload.newAddress[key]) {
                alert("Please fill all address fields");
                return;
            }
        }
    }

    fetch("/cart/place-Order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(order => openRazorpay(order))
    .catch(err => console.error("Order error:", err));
}

function openRazorpay(order) {
    new Razorpay({
        key: "rzp_test_SBA3kqiat8sYVm",
        amount: order.totalPrice * 100,
        currency: "INR",
        order_id: order.razorpayOrderId,
        handler: res => verifyPayment(res)
    }).open();
}

function verifyPayment(response) {
    fetch("/cart/payment-verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(response)
    })
    .then(res => res.text())
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    });
}

setTimeout(() => {
    const msg = document.getElementById("flashMsg");
    if (msg) msg.style.display = "none";
}, 5000);
</script>

</body>
</html>
