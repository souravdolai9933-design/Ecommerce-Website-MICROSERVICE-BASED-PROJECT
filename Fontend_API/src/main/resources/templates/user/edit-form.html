<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Address | Sourav Ecom</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f1f3f6;">

<div class="container mt-5" style="max-width:700px;">
    <div class="card shadow p-4">

        <h4 class="mb-4">Edit Shipping Address</h4>

        <form th:action="@{/cart/address/update}" method="post">

            <!-- Address ID -->
            <input type="hidden" name="addid" th:value="${address.addid}"/>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Name</label>
                    <input class="form-control" name="receiverName"
                           th:value="${address.receiverName}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Phone</label>
                    <input class="form-control" name="receiverPhnNo"
                           th:value="${address.receiverPhnNo}" required>
                </div>

                <div class="col-md-12 mb-3">
                    <label>House / Flat</label>
                    <input class="form-control" name="houseno"
                           th:value="${address.houseno}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>City</label>
                    <input class="form-control" name="city"
                           th:value="${address.city}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>State</label>
                    <input class="form-control" name="state"
                           th:value="${address.state}" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label>Country</label>
                    <input class="form-control" name="country"
                           th:value="${address.country}" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Zipcode</label>
                    <input class="form-control" name="zipcode"
                           th:value="${address.zipcode}" required>
                </div>

            </div>

            <div class="mt-3">
                <button class="btn btn-primary">Update Address</button>
                <a href="/cart/checkout" class="btn btn-secondary ms-2">Cancel</a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
