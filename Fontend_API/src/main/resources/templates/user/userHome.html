<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MyShop | Online Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.25);
            transition: 0.3s ease;
            z-index: 1050;
        }

        .sidebar.open { left: 0; }

        .sidebar a {
            padding: 10px;
            display: block;
            color: #0d6efd;
            text-decoration: none;
            border-radius: 4px;
        }

        .sidebar a:hover { background-color: #f1f1f1; }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1040;
        }

        .overlay.show { display: block; }

        .product-card img {
            height: 180px;
            object-fit: contain;
        }

        .navbar-search {
            width: 350px;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark px-3 d-flex align-items-center">

    <button class="btn btn-outline-light me-3" onclick="openMenu()">
        <i class="bi bi-list"></i>
    </button>

    <span class="navbar-brand fw-bold me-4">MyShop</span>

    <!-- SEARCH -->
    <form class="d-flex navbar-search me-auto"
          th:action="@{/user/findProductName}"
          method="get">

        <input class="form-control me-2"
               type="search"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search products..."
               required>

        <button class="btn btn-outline-light" type="submit">
            <i class="bi bi-search"></i>
        </button>
    </form>

    <a th:href="@{/user/my-orders}" class="btn btn-outline-info me-2">
        <i class="bi bi-bag-check"></i> My Orders
    </a>

    <a th:href="@{/cart/view}" class="btn btn-warning">
        <i class="bi bi-cart"></i> Cart
    </a>

</nav>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar" id="sidebar">
    <h5 class="mb-3">Categories</h5>

    <div th:if="${#lists.isEmpty(allcategory)}">
        <p class="text-muted">No categories found</p>
    </div>

    <a th:each="cat : ${allcategory}"
       th:text="${cat.name}"
       th:href="@{/user/getProduct(id=${cat.id}, page=0)}">
    </a>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- ================= PRODUCT LIST ================= -->
<div class="container mt-4">

    <h4 class="mb-3">Products</h4>

    <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning">
        No products available
    </div>

    <div class="row g-4">
        <div class="col-lg-3 col-md-4 col-sm-6"
             th:each="product : ${products}">
            <div class="card product-card shadow-sm h-100">

                <a th:href="@{/user/masterView(id=${product.id})}">
                    <img th:src="@{'http://localhost:8085/uploads/images/' + ${product.imgurl}}"
                         class="card-img-top"
                         alt="Product Image">
                </a>

                <div class="card-body text-center">
                    <h6 th:text="${product.title}" class="fw-semibold"></h6>

                    <p class="text-success fw-bold mb-2">
                        ₹ <span th:text="${product.price}"></span>
                    </p>

                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                        <button type="submit" class="btn btn-warning w-100">
                            Add to Cart
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- ================= PAGINATION ================= -->
    <nav th:if="${totalPages > 1}" class="mt-5">
        <ul class="pagination justify-content-center">

            <!-- PREV -->
            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">

                <a class="page-link"
                   th:href="@{${url}(page=${currentPage-1},
                                    keyword=${keyword},
                                    id=${categoryId})}">
                    Prev
                </a>
            </li>

            <!-- PAGE NUMBERS -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                th:classappend="${currentPage == i} ? 'active'">

                <a class="page-link"
                   th:text="${i+1}"
                   th:href="@{${url}(page=${i},
                                    keyword=${keyword},
                                    id=${categoryId})}">
                </a>
            </li>

            <!-- NEXT -->
            <li class="page-item"
                th:classappend="${currentPage == totalPages-1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{${url}(page=${currentPage+1},
                                    keyword=${keyword},
                                    id=${categoryId})}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

</div>

<!-- ================= SCRIPT ================= -->
<script>
    function openMenu() {
        document.getElementById("sidebar").classList.add("open");
        document.getElementById("overlay").classList.add("show");
    }

    function closeMenu() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("overlay").classList.remove("show");
    }
</script>

</body>
</html>
